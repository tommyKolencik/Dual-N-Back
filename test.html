<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Test 1</title>
<style>
  :root {
    --bg: #2c130e;
    --panel: #312320;
    --accent: #6fd9ff;
    --text: #e8e8f0;
    --muted: #9a9ab0;
  }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 640px;
    margin: 60px auto;
    padding: 0 20px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; }
  .panel {
    background: var(--panel);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  button {
    background: var(--accent);
    color: #10101a;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  input[type="text"] {
    background: #10101a;
    border: 1px solid #3a3a52;
    color: var(--text);
    border-radius: 6px;
    padding: 10px 12px;
    width: 60%;
    margin-right: 8px;
  }
  pre {
    background: #10101a;
    padding: 12px;
    border-radius: 6px;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 20px;
    color: #b6f0c0;
  }
  .error { color: #ff8a8a; }
</style>
</head>
<body>

<h1>Test 1</h1>
<p class="sub">Make sure your Flask server is running on <code>http://127.0.0.1:5001</code></p>

<div class="panel">
  <h3>GET /api/data</h3>
  <button onclick="fetchData()">Fetch from backend</button>
  <pre id="get-result">—</pre>
</div>

<div class="panel">
  <h3>POST /api/send</h3>
  <input type="text" id="user-input" placeholder="Type a message...">
  <button onclick="sendData()">Send to backend</button>
  <pre id="post-result">—</pre>
</div>

<script>
  const BASE_URL = "http://127.0.0.1:5001";

  async function fetchData() {
    const out = document.getElementById("get-result");
    out.textContent = "Loading...";
    out.classList.remove("error");
    try {
      const res = await fetch(`${BASE_URL}/api/data`);
      if (!res.ok) throw new Error(`Server responded with ${res.status}`);
      const data = await res.json();
      out.textContent = JSON.stringify(data, null, 2);
    } catch (err) {
      out.classList.add("error");
      out.textContent = `Error: ${err.message}\n(Is the Flask server running and CORS enabled?)`;
    }
  }

  async function sendData() {
    const out = document.getElementById("post-result");
    const inputEl = document.getElementById("user-input");
    const message = inputEl.value.trim();

    if (!message) {
      out.classList.add("error");
      out.textContent = "Please type something first.";
      return;
    }

    out.classList.remove("error");
    out.textContent = "Sending...";

    try {
      const res = await fetch(`${BASE_URL}/api/send`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userInput: message })
      });
      if (!res.ok) throw new Error(`Server responded with ${res.status}`);
      const data = await res.json();
      out.textContent = JSON.stringify(data, null, 2);
    } catch (err) {
      out.classList.add("error");
      out.textContent = `Error: ${err.message}`;
    }
  }
</script>

</body>
</html>
